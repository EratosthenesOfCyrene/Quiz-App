<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ_SELBST_JM</title>


    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <!--Bootstrap file-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</head>

<body>

    <div id="bg-container" class="bg-container"> <!--Hintergrund-->

                <!--Progress-Bar-->
        <div class="progress" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>

        <div id="card" class="card"> <!--Karte-->

            <div id="menu" class="menu"> <!--menü-links-->

                <div class="image-menu"><img src="style_dark/logo.png" alt="" class="logo-img"></div>

                <div class="links">
                    <div onclick="initHtml()" class="link-menu txt-align" id="html-quiz">
                        <b>HTML</b>
                    </div>

                    <div onclick="initCss()" class="link-menu txt-align" id="css-quiz">
                        <b>CSS</b>
                    </div>

                    <div class="link-menu txt-align" id="js-quiz">
                        <b>JS</b>
                    </div>

                    <div class="link-menu txt-align" id="java-quiz">
                        <b>Java</b>
                    </div>
                </div>

            </div>


            <div id="questions-body" class="card-body">  <!--Start-Menü-->
                
                <img src="style_dark/brainbg.jpg" alt="" class="brain-img">

                    <div class="headline">    
                        <h2>Welcome to <br> The awesome </h2>
                         <h3 id="quiz-type">Coding</h3> <h2>Quiz</h2> Ready for the Challenge?
                    </div>

                <button class="btn" disabled id="start-btn">
                    START NOW <img src="style_dark/arrow_white.png" alt="" class="arrow">
                </button>

            </div>







                        <!--Fragen-->

            <div id="questionsBody" class="card-body padding-top" style="display: none">

                <h5 class="card-title" id="questiontext">Frage</h5>
    
                <div class="answer-card" onclick="answer('answer_1')">
                    <div class="letter-box"> <b>A</b> </div>
                    <div class="answer-box"id="answer_1">Antwort1</div>
                </div>
    
                <div class="answer-card" onclick="answer('answer_2')">
                    <div class="letter-box"> <b>B</b> </div>
                    <div class="answer-box" id="answer_2">Antwort2</div>
                </div>
    
                <div class="answer-card" onclick="answer('answer_3')">
                    <div class="letter-box"> <b>C</b> </div>
                    <div class="answer-box" id="answer_3">Antwort3</div>
                </div>
    
                <div class="answer-card" onclick="answer('answer_4')">
                    <div class="letter-box"> <b>D</b> </div>
                    <div class="answer-box" id="answer_4">Antwort4</div>
                </div>
    
    
                <div class="arrows-bottom">
                   <button onclick="previousQuestion()" id="backward-btn" disabled><img id="forward-arrow" src="style_dark/arrow_blue_backward.png" class="arrow-blue" alt=""> </button>
                   <button onclick="nextQuestion()" id="forward-btn" disabled><img src="style_dark/arrow_blue_forward.png" class="arrow-blue" alt=""> </button> 
                </div>
    
            </div>
    
    
    


    
                        <!--End-Screen-->
    
            <div class="end-screen" id="endscreen" style="display: none">
                <div class="result-img">
                    <img class="rs-img" src="style_dark/brain result.png" alt="">
                    <div class="result-img-text"><b>Complete <br> HTMLQuiz</b></div>
    
                    <div class="score-txt"> 
                        <div class="sc-txt-your-score"> <b>YOUR SCORE</b> </div>
    
                        <div> <b id="amount-of-right-questions"> XX </b> 
                        <b>/</b>  
                        <b id="amount-of-questions"> XX </b> </div> 
                    </div>
    
                    <button class="end-btn">SHARE</button>
                    <button onclick="restartGame()" class="end-btn">REPLAY</button>
    
                </div>
                     
    
            </div>







        </div>

    </div>



</body>

</html>
